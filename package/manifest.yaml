external_training_data: []

reproducibility:
  random_seeds: []            # none consumed at inference; training seeds in docs/PROVENANCE.md
  precision_mode: "video members fp16 autocast with horizontal-flip TTA; skeleton stack fp32; IMU forest exact integer tree walk; fusion and decoder float64"
  expected_nondeterminism: "none on one machine (byte-identical repeated runs). Across GPU generations: posterior differences <= 1.6e-3 measured RTX 4060 vs A100 with 0/405 prediction changes; see README section 7"
  comparison_notes: "submission 56213683 reproduces byte-for-byte. Submission 56212349 (primary) reproduces 403/405 rows: SM_test_0206 and SM_test_0382 are decoder near-ties affected by the 48->20 member prune of the skeleton stack; cause, margins and the exhaustive coefficient search are documented in README sections 1 and 7 and docs/verification_logs/"

inference_input:
  type: "official_label_free_testing_directory"
  path_supplied_by_organizer: true
  published_layout_preserved: true
  participant_preprocessing_included: true

declarations:
  honor_declaration_form: "declarations/CUHK-X_Honor_Declaration.docx"
  signed_declaration: "declarations/CUHK-X_Honor_Declaration_signed.pdf"
