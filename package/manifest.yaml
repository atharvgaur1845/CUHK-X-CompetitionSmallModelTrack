# CUHK-X verification manifest -- team AGX, Small Model Track
schema_version: 2

team:
  name: "AGX"
  track: "small"
  contact_email: "atharvgaur591@gmail.com"
  members:
    - name: "Atharv"
      email: "atharvgaur591@gmail.com"
      affiliation: "Independent"
      country: "India"

kaggle_submission_record:
  path: "submission/submission_info.yaml"
  selected_submission_count: 2

solution:
  type: "ensemble"
  entrypoint: "inference.sh"
  primary_config: "configs/56212349.json"      # second Selected submission: configs/56213683.json (identical coefficients)
  source_root: "src"
  code_map: "src/CODE_MAP.md"
  training_provenance: "docs/PROVENANCE.md"

environment:
  specification: "environment/requirements.txt"
  dockerfile: "environment/Dockerfile"
  docker_image: "ghcr.io/atharvgaur1845/cuhkx-small-agx:v1 (also image.tar.gz, sha256 in the submission form)"
  operating_system: "Ubuntu 22.04 (image); verified from Ubuntu 24.04 and Rocky Linux 8 hosts"
  python_version: "3.11 (image); 3.12 on the development laptop"
  cuda_or_accelerator_version: "CUDA 12.6 runtime in the image (torch 2.7.1+cu126); NVIDIA driver >= 525"
  system_packages: []

hardware:
  gpu_count: 1
  minimum_gpu_memory_gb_per_gpu: 6
  minimum_host_memory_gb: 8
  minimum_free_disk_gb: 1
  expected_setup_time: "3-5 min (docker load) or docker pull"
  expected_inference_time: "2 min 39 s on an A100 for the 405 Kaggle clips; 4 min 53 s on an RTX 4060 laptop"

network:
  required_during_setup: false
  required_during_inference: false
  allowed_hosts: []
  explanation: "The image contains every dependency and weight. inference.sh sets an empty TORCH_HOME and YOLO_OFFLINE=1; models are built with pretrained=False and loaded from the package."

api:
  required: false
  provider: null
  model_and_version: null
  configuration_example: null
  credential_environment_variables: []
  estimated_usage: null

